name: Auto Update GFS Wind Data

on:
  schedule:
    # Chạy tự động 4 lần mỗi ngày lúc 03:30, 09:30, 15:30, 21:30 UTC
    - cron: '30 3,9,15,21 * * *'
  workflow_dispatch: # Cho phép bấm nút chạy thủ công để test bất kỳ lúc nào

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Khởi tạo môi trường Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cài đặt hệ thống thư viện C & Python
        run: |
          sudo apt-get update && sudo apt-get install -y libeccodes-dev
          pip install xarray cfgrib requests eccodes

      - name: Chạy Script chuyển đổi GFS sang JSON
        run: python scripts/update_gfs.py

      - name: Tự động Upload file JSON lên Host qua FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: public/data/
          server-dir: /nangmua.vn/json_gfs/ # Thư mục chứa file JSON trên Host của bạn
